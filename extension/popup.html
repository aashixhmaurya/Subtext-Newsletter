<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; padding: 16px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; color: #1d1d1f; background: #fbfbfd; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; margin-bottom: 12px; }
      .title { font-size: 14px; margin: 0 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .meta { color: #86868b; font-size: 12px; margin: 0 0 14px; }
      button { width: 100%; border: 0; border-radius: 6px; padding: 9px; background: #111; color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
      button:disabled { background: #86868b; }
      details { margin-top: 14px; color: #6e6e73; }
      summary { cursor: pointer; font-size: 12px; }
      input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 7px 10px; border: 1px solid #e2e2e6; border-radius: 6px; font: inherit; background: #fff; }
      .status { margin-top: 10px; font-size: 12px; color: #6e6e73; min-height: 1em; }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg width="16" height="16" viewBox="0 0 18 18"><rect x="1" y="4" width="16" height="2.6" rx="1.3" fill="#1d1d1f"/><rect x="1" y="10.4" width="9.5" height="2.6" rx="1.3" fill="#1d1d1f" opacity=".35"/></svg>
      Subtext
    </div>
    <p class="title" id="title">Reading page…</p>
    <p class="meta" id="meta"></p>
    <button id="save" disabled>Save to sources</button>
    <div class="status" id="status"></div>
    <details>
      <summary>Subtext address</summary>
      <input id="base" placeholder="http://localhost:3000" />
    </details>
    <script src="popup.js"></script>
  </body>
</html>
